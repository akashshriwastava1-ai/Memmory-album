<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Album</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
text-align:center;
}
.header{
padding:20px;
font-size:30px;
font-weight:bold;
background:#222;
}
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}
.card{
background:#1e1e1e;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}
.card img{
width:100%;
height:220px;
object-fit:cover;
}
.card h3{
margin:15px 0 5px;
}
.btn{
display:inline-block;
margin:15px;
padding:12px 25px;
background:#ff4d6d;
color:white;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}
</style>
</head>
<body>

<div class="header">Rahul & Priya Wedding Album</div>

<div class="gallery">

<div class="card">
<img src="https://picsum.photos/400/300?1">
<h3>Engagement</h3>
<a class="btn" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">Play Video</a>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?2">
<h3>Haldi</h3>
<a class="btn" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">Play Video</a>
</div>

<div class="card">
<img src="https://picsum.photos/400/300?3">
<h3>Wedding</h3>
<a class="btn" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">Play Video</a>
</div>

</div>

</body>
</html>
